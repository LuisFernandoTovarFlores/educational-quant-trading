# Configuración del sistema de swing trading cuantitativo
# Basado en AGENTS.md

# Parámetros del proyecto
project:
  name: "Quantitative Swing Trading"
  horizon_weeks: 8
  target_return_pct: 10.0  # Meta neta acumulada (%)
  weekly_target_pct: 1.19  # (1 + 0.10)^(1/8) - 1

# Estructura de capital
capital:
  initial_mxn: 100000.0
  concentration: 1.0  # 100% en un solo activo

# Tipo de cambio de referencia (contabilidad/reportes; no es una cotización en vivo)
fx:
  usd_mxn: 20.0  # Supuesto aproximado; sobrescribir con el tipo de cambio real

# Costos transaccionales
costs:
  commission_pct: 0.20  # 0.20% sobre el valor de la cartera
  charge_on: "weekly"   # "weekly": una vez por semana ISO | "rotation": solo al rotar

# Regla de liquidez (efectivo sintético)
cash_proxy:
  tickers: ["SGOV", "BIL", "SHY"]
  max_weekly_volatility_pct: 0.05

# Algoritmo de decisión (Hold vs Rotate)
decision:
  # Condición de mantenimiento (Hold)
  hold:
    ema_period: 21  # EMA21 en gráfico diario (D1)
    earnings_filter: true  # No mantener si reporta earnings semana entrante
    min_score_percentile: 30  # Top 30% del screener

  # Condición de rotación (Rotate)
  rotate:
    score_hurdle_points: 15  # Candidato debe superar por ≥15 puntos
    min_risk_reward_ratio: 2.0  # Ratio R:B mínimo 2:1
    # El rango semanal esperado se calcula en src/risk.py como √5 × ATR ≈ 2.24 × ATR

# Gestión de riesgo
risk:
  stop_loss:
    method: "atr"  # "atr" o "structural"
    atr_period: 14
    multipliers:
      standard: 2.5      # Acciones y ETFs 1x: 2.5×ATR
      leveraged_3x: 3.0  # ETFs apalancados 3x (TQQQ, SOXL, FNGU, SQQQ, SOXS): 3.0×ATR
    max_risk_pct: 12.0   # Cap de idoneidad: si el stop > 12%, el activo es no apto
    slippage_buffer_pct: 0.5  # Buffer de slippage adicional
  leveraged_3x_tickers:    # Lista de ETFs 3x (aplican multiplicador 3.0×ATR)
    - "TQQQ"
    - "SOXL"
    - "FNGU"
    - "SQQQ"
    - "SOXS"
  take_profit: false  # No se usa take profit

# Indicadores técnicos
indicators:
  ema:
    periods: [9, 21]
  atr:
    period: 14
  rsi:
    period: 14
  returns:
    periods: [1, 5, 20]  # días

# Scoring compuesto
scoring:
  weights:
    momentum: 0.30
    trend: 0.25
    volatility: 0.20
    liquidity: 0.10
    regime: 0.15
  momentum:
    ret5d_weight: 0.4
    ret20d_weight: 0.6
  volatility:
    ideal_range: [2.0, 5.0]  # ATR% ideal
    min_acceptable: 1.0
    max_acceptable: 8.0
  liquidity:
    ideal_range: [0.8, 1.5]  # Volumen relativo ideal
  regime:
    ideal_range: [50, 70]  # RSI ideal

# Fuentes de datos
data:
  provider: "yfinance"
  intervals: ["1d", "1wk"]  # Diario y semanal
  lookback_days: 365  # 1 año de histórico
  period: "1y"  # Período solicitado a yfinance

# Reportes
reporting:
  output_dir: "output"
  format: "markdown"
  top_n: 3  # Top N candidatos en reporte
