name: Bug report
description: Report a reproducible bug in the framework.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not paste API keys, `.env` contents or
        real portfolio data.** For security issues, follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python -m src.run_weekly --skip-earnings`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version / commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (sanitized)
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed all secrets and personal data from the report.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
